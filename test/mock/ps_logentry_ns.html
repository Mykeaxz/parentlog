<!doctype html><html><head><meta charset="utf-8"><title>Log Entry</title></head>
<body style="font-family:Arial;margin:0">
<div id="content-main" style="padding:12px"><h1 style="font-size:16px">Doe, Alex</h1>
<form id="f" action="/teachers/changesrecorded.html" method="get">
<div class="form-row"><label for="d">Date &amp; Time</label> <input id="d" type="text" name="entrydate" value=""> <input type="text" name="entrytime" value="09:32 AM" size="8"></div>
<div class="form-row"><label>Author</label> <input type="text" name="author" value="Rapp, Jamie" readonly></div>
<div class="form-row"><label for="lt">Log Type</label> <select id="lt" name="logtypeid"><option value="">Select</option><option value="1">Attendance Notes</option><option value="2">Behaviour Note</option><option value="3">Teacher Contact</option><option value="4">Counsellor Admin</option></select></div>
<div class="form-row"><label for="s">Subject</label> <input id="s" type="text" name="subject"></div>
<div class="form-row"><label for="e">Log Entry Text</label> <textarea id="e" name="entrytext" rows="6" cols="60"></textarea></div>
<button type="submit">Submit</button>
</form></div></body></html>
